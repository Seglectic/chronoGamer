<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chronoGamer</title>
  <meta name="description" content="Browse 12,000+ retro game releases chronologically; filter by console, region (NA/JP/PAL), and era. Pre-PS2.">

  <meta property="og:title" content="chronoGamer">
  <meta property="og:description" content="Browse 12,000+ retro game releases chronologically — filter by console, region (NA/JP/PAL), and era. Pre-PS2 era, US and JP releases.">
  <meta property="og:image" content="https://seglectic.com/chronoGamer/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://seglectic.com/chronoGamer/">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://seglectic.com/chronoGamer/preview.png">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="layout">
    <div id="app">
      <header id="toolbar">
        <div id="toolbar-left">
          <button id="wordmark" type="button" aria-label="Scroll to top">chrono<span class="accent">Gamer</span></button>
          <input id="search-input" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false">
          <button id="filter-toggle" type="button" aria-label="Toggle filters" aria-expanded="false">Filters</button>
        </div>
        <div id="filter-panel">
          <label id="date-filter">
            <span class="filter-label">From</span>
            <input id="date-from" type="date" min="1977-01-01" max="2000-12-31">
          </label>
          <div id="region-filters"></div>
          <button id="console-btn" type="button">Consoles</button>
        </div>
      </header>

      <div id="list-header">
        <span class="col-date">Date</span>
        <span class="col-console">Console</span>
        <span class="col-title">Title</span>
        <span id="game-count"></span>
      </div>

      <div id="scroll-container">
        <div id="game-list"></div>
      </div>
    </div>

    <aside id="timeline-rail">
      <div id="timeline-bar">
        <div id="timeline-labels"></div>
        <div id="timeline-handle" role="slider" aria-label="Jump to year" tabindex="0"></div>
      </div>
    </aside>
  </div>

  <div id="console-modal" role="dialog" aria-modal="true" aria-labelledby="console-modal-title">
    <div id="console-modal-box">
      <div id="console-modal-header">
        <span id="console-modal-title">Consoles</span>
        <div id="console-modal-actions">
          <button id="console-all-btn" type="button">All</button>
          <button id="console-none-btn" type="button">None</button>
          <button id="console-modal-close" type="button" aria-label="Close">✕</button>
        </div>
      </div>
      <div id="console-modal-body"></div>
    </div>
  </div>

  <div id="loading">
    <div id="loading-inner">
      <div class="spinner"></div>
      <span>Loading game library…</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
